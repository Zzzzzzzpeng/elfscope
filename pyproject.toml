[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elfscope"
version = "0.1.0"
description = "Static ELF triage and defensive reverse-engineering assistant for Linux binaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ELFscope contributors" }
]
keywords = ["elf", "reverse-engineering", "binary-analysis", "linux", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration"
]
dependencies = [
  "pyelftools>=0.33"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
elfscope = "elfscope.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
